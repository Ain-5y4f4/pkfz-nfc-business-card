<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Digital Business Card - Noor Syakira Binti Muhd Anuar">

    <meta name="theme-color"
          content="#f5f5f5">

    <title>Noor Syakira Binti Muhd Anuar | Digital Business Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="business-card">

        <!-- Profile Image -->
        <div class="profile-container">
            <img
                src="business-card.png"
                alt="Noor Syakira Binti Muhd Anuar"
                class="profile-image"
            >
        </div>


        <!-- Name -->
        <h1>
            Noor Syakira Binti Muhd Anuar
        </h1>


        <!-- Position -->
        <h2>
            Executive
        </h2>


        <!-- Department -->
        <p class="department">
            Sales &amp; Marketing Department
        </p>


        <!-- Contact Information -->
        <div class="contact-section">

            <!-- Email -->
            <a
                href="mailto:syakira@pkfz.com"
                class="contact-button"
            >
                <span class="icon">✉</span>

                <span class="contact-text">
                    <strong>Email</strong>
                    <small>syakira@pkfz.com</small>
                </span>
            </a>


            <!-- Mobile Phone -->
            <a
                href="tel:+60189744486"
                class="contact-button"
            >
                <span class="icon">📱</span>

                <span class="contact-text">
                    <strong>Mobile</strong>
                    <small>018-974 4486</small>
                </span>
            </a>


            <!-- Office -->
            <a
                href="tel:+60331015568"
                class="contact-button"
            >
                <span class="icon">☎</span>

                <span class="contact-text">
                    <strong>Office</strong>
                    <small>03-3101 5568</small>
                </span>
            </a>


            <!-- WhatsApp -->
            <a
                href="https://wa.me/60189744486"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-button"
            >
                <span class="icon">💬</span>

                <span class="contact-text">
                    <strong>WhatsApp</strong>
                    <small>018-974 4486</small>
                </span>
            </a>

        </div>


        <!-- Save Contact -->
        <button
            type="button"
            class="save-contact"
            onclick="saveContact()"
        >
            <span>＋</span>
            Save Contact
        </button>


        <!-- Footer -->
        <p class="footer">
            PKFZ • Sales &amp; Marketing Department
        </p>

    </main>


    <script src="script.js"></script>

</body>
</html>
