<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0878d1"
    >

    <meta
        name="description"
        content="Digital Business Card - Noor Syakira Binti Muhd Anuar"
    >

    <title>
        Noor Syakira Binti Muhd Anuar | PKFZ
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         DECORATIVE BACKGROUND
    ========================================== -->

    <div class="bg-circle bg-circle-blue"></div>

    <div class="bg-circle bg-circle-green"></div>

    <div class="bg-curve curve-blue"></div>

    <div class="bg-curve curve-green"></div>


    <!-- =========================================
         MAIN BUSINESS CARD
    ========================================== -->

    <main class="business-card">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="card-header">


            <!-- PKFZ LOGO -->

            <div class="company-brand">

                <img
                    src="pkfz-logo.png"
                    alt="Port Klang Free Zone Malaysia"
                    class="pkfz-logo"
                >

            </div>


            <!-- TAGLINE -->

            <div class="company-tagline">

                <span>CONNECTING</span>

                <span>BUSINESS</span>

                <span>ENABLING</span>

                <span>OPPORTUNITIES</span>

            </div>


        </header>


        <!-- =====================================
             PROFILE
        ====================================== -->

        <section class="profile-section">


            <!-- Decorative text -->

            <div class="logistics-text">

                <span>A Global</span>

                <span>Logistics Hub</span>

            </div>


            <!-- Photo -->

            <div class="profile-ring">

                <div class="profile-inner">

                    <img
                        src="business-card.png"
                        alt="Noor Syakira Binti Muhd Anuar"
                        class="profile-photo"
                    >

                </div>

            </div>


        </section>


        <!-- =====================================
             PERSONAL DETAILS
        ====================================== -->

        <section class="personal-information">


            <h1>
                Noor Syakira Binti Muhd Anuar
            </h1>


            <h2>
                Executive
            </h2>


            <div class="department">
                Sales &amp; Marketing Department
            </div>


        </section>


        <!-- =====================================
             CONTACT INFORMATION
        ====================================== -->

        <section class="contact-section">


            <!-- EMAIL -->

            <a
                href="mailto:syakira@pkfz.com"
                class="contact-item"
            >

                <div class="contact-icon email-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        ></rect>

                        <polyline
                            points="3,7 12,13 21,7"
                        ></polyline>

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>Email</strong>

                    <span>
                        syakira@pkfz.com
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- MOBILE -->

            <a
                href="tel:+60189744486"
                class="contact-item"
            >

                <div class="contact-icon mobile-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="7"
                            y="2"
                            width="10"
                            height="20"
                            rx="2"
                        ></rect>

                        <line
                            x1="10"
                            y1="18"
                            x2="14"
                            y2="18"
                        ></line>

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>Mobile</strong>

                    <span>
                        018-974 4486
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- OFFICE -->

            <a
                href="tel:+60331015568"
                class="contact-item"
            >

                <div class="contact-icon office-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M5 22V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v19"
                        ></path>

                        <path
                            d="M3 22h18"
                        ></path>

                        <rect
                            x="8"
                            y="6"
                            width="2"
                            height="2"
                        ></rect>

                        <rect
                            x="14"
                            y="6"
                            width="2"
                            height="2"
                        ></rect>

                        <rect
                            x="8"
                            y="11"
                            width="2"
                            height="2"
                        ></rect>

                        <rect
                            x="14"
                            y="11"
                            width="2"
                            height="2"
                        ></rect>

                        <path
                            d="M10 22v-5h4v5"
                        ></path>

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>Office</strong>

                    <span>
                        03-3101 5568
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- WHATSAPP -->

            <a
                href="https://wa.me/60189744486"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-item"
            >

                <div class="contact-icon whatsapp-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M20.5 11.5a8.5 8.5 0 0 1-12.8 7.4L4 20l1.2-3.7A8.5 8.5 0 1 1 20.5 11.5Z"
                        ></path>

                        <path
                            d="M8.5 8.5c.2-.5.4-.6.8-.6h.5c.2 0 .4.1.5.4l.8 1.7c.1.2.1.5-.1.7l-.6.6c.6 1.2 1.5 2.1 2.7 2.7l.6-.6c.2-.2.5-.2.7-.1l1.7.8c.3.1.4.3.4.5v.5c0 .4-.1.6-.6.8-.5.2-1.3.2-2.5-.3-1.1-.5-2.2-1.2-3.1-2.1-.9-.9-1.6-2-2.1-3.1-.5-1.2-.5-2-.3-2.5Z"
                        ></path>

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>WhatsApp</strong>

                    <span>
                        018-974 4486
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


        </section>


        <!-- =====================================
             SAVE CONTACT
        ====================================== -->

        <button
            type="button"
            class="save-contact"
            onclick="saveContact()"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <circle
                    cx="9"
                    cy="7"
                    r="3"
                ></circle>

                <path
                    d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"
                ></path>

                <line
                    x1="19"
                    y1="8"
                    x2="19"
                    y2="15"
                ></line>

                <line
                    x1="15.5"
                    y1="11.5"
                    x2="22.5"
                    y2="11.5"
                ></line>

            </svg>


            <span>
                Save Contact
            </span>

        </button>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="card-footer">


            <div class="footer-company">
                PORT KLANG FREE ZONE
            </div>


            <div class="footer-country">
                MALAYSIA
            </div>


            <div class="footer-line"></div>


            <div class="footer-values">

                <span>PEOPLE</span>

                <b>|</b>

                <span>PARTNERSHIP</span>

                <b>|</b>

                <span>PROSPERITY</span>

            </div>


        </footer>


    </main>


    <script src="script.js"></script>


</body>

</html>
