<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Digital Business Card - Noor Syakira Binti Muhd Anuar"
    >

    <meta
        name="theme-color"
        content="#0d6efd"
    >

    <title>
        Noor Syakira Binti Muhd Anuar | PKFZ
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         BACKGROUND DECORATION
    ========================================== -->

    <div class="background-shape shape-one"></div>

    <div class="background-shape shape-two"></div>

    <div class="background-shape shape-three"></div>


    <!-- =========================================
         MAIN BUSINESS CARD
    ========================================== -->

    <main class="business-card">


        <!-- =====================================
             TOP HEADER
        ====================================== -->

        <header class="card-header">


            <!-- PKFZ LOGO -->

            <div class="company-brand">

                <img
                    src="pkfz-logo.png"
                    alt="Port Klang Free Zone Malaysia"
                    class="pkfz-logo"
                >

            </div>


            <!-- TAGLINE -->

            <div class="company-tagline">

                <span>
                    CONNECTING
                </span>

                <span>
                    BUSINESS
                </span>

                <span>
                    ENABLING
                </span>

                <span>
                    OPPORTUNITIES
                </span>

            </div>


        </header>


        <!-- =====================================
             PROFILE SECTION
        ====================================== -->

        <section class="profile-section">


            <!-- Decorative ring -->

            <div class="profile-ring">


                <div class="profile-inner">


                    <img
                        src="business-card.png"
                        alt="Noor Syakira Binti Muhd Anuar"
                        class="profile-photo"
                    >


                </div>


            </div>


            <!-- Logistics text -->

            <div class="logistics-text">

                <span>
                    A Global
                </span>

                <span>
                    Logistics Hub
                </span>

            </div>


        </section>


        <!-- =====================================
             PERSONAL INFORMATION
        ====================================== -->

        <section class="personal-information">


            <h1>
                Noor Syakira Binti Muhd Anuar
            </h1>


            <h2>
                Executive
            </h2>


            <div class="department">

                Sales &amp; Marketing Department

            </div>


        </section>


        <!-- =====================================
             CONTACT INFORMATION
        ====================================== -->

        <section class="contact-section">


            <!-- EMAIL -->

            <a
                href="mailto:syakira@pkfz.com"
                class="contact-item"
            >

                <div class="contact-icon email-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M3 5h18v14H3z"
                        />

                        <path
                            d="m3 6 9 7 9-7"
                        />

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>
                        Email
                    </strong>

                    <span>
                        syakira@pkfz.com
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- MOBILE -->

            <a
                href="tel:+60189744486"
                class="contact-item"
            >

                <div class="contact-icon mobile-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="7"
                            y="2"
                            width="10"
                            height="20"
                            rx="2"
                        />

                        <line
                            x1="10"
                            y1="18"
                            x2="14"
                            y2="18"
                        />

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>
                        Mobile
                    </strong>

                    <span>
                        018-974 4486
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- OFFICE -->

            <a
                href="tel:+60331015568"
                class="contact-item"
            >

                <div class="contact-icon office-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M6 2h12v20H6z"
                        />

                        <path
                            d="M9 6h6"
                        />

                        <path
                            d="M9 10h2"
                        />

                        <path
                            d="M13 10h2"
                        />

                        <path
                            d="M9 14h2"
                        />

                        <path
                            d="M13 14h2"
                        />

                        <path
                            d="M10 22v-4h4v4"
                        />

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>
                        Office
                    </strong>

                    <span>
                        03-3101 5568
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- WHATSAPP -->

            <a
                href="https://wa.me/60189744486"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-item"
            >

                <div class="contact-icon whatsapp-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"
                        />

                        <path
                            d="M8.5 8.5c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.5c.1.2.1.4-.1.6l-.5.6c.6 1.1 1.5 2 2.6 2.6l.6-.5c.2-.2.4-.2.6-.1l1.5.7c.3.1.4.3.4.5v.5c0 .3 0 .5-.4.7-.4.2-1.3.3-2.5-.2-1.1-.5-2.1-1.2-3-2.1-.9-.9-1.6-1.9-2.1-3-.5-1.2-.4-2.1-.2-2.5Z"
                        />

                    </svg>

                </div>


                <div class="contact-content">

                    <strong>
                        WhatsApp
                    </strong>

                    <span>
                        018-974 4486
                    </span>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


        </section>


        <!-- =====================================
             SAVE CONTACT
        ====================================== -->

        <button
            type="button"
            class="save-contact"
            onclick="saveContact()"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <circle
                    cx="9"
                    cy="7"
                    r="3"
                />

                <path
                    d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"
                />

                <path
                    d="M19 8v6"
                />

                <path
                    d="M16 11h6"
                />

            </svg>


            <span>
                Save Contact
            </span>

        </button>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="card-footer">


            <div class="footer-company">

                PORT KLANG FREE ZONE

            </div>


            <div class="footer-country">

                MALAYSIA

            </div>


            <div class="footer-line"></div>


            <div class="footer-values">

                <span>
                    PEOPLE
                </span>

                <b>|</b>

                <span>
                    PARTNERSHIP
                </span>

                <b>|</b>

                <span>
                    PROSPERITY
                </span>

            </div>


        </footer>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>


</body>

</html>
